[workspace]
resolver = "2"
members = ["crates/steamrip-core", "crates/steamrip-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "0.2"
sha2 = "0.10"
base64 = "0.22"
url = "2"
